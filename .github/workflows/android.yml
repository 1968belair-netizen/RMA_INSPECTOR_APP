name: Android build

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # "latest" release + screenshots branch
  pull-requests: write   # screenshot comment
  issues: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # A fixed debug signing key lets the tablet install each new APK over the old one.
      - name: Restore debug signing key
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Using fixed debug key."
          else
            echo "::warning::DEBUG_KEYSTORE_B64 not set — APK signed with a throwaway key."
          fi

      # recordRoborazziDebug runs all JVM unit tests and records the screenshot PNGs.
      - name: Build, unit tests, screenshots
        run: ./gradlew --no-daemon -PversionCode=${{ github.run_number }} assembleDebug recordRoborazziDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "RMA-Inspector-0.1.${{ github.run_number }}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: RMA-Inspector-debug-apk
          path: RMA-Inspector-*-debug.apk
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: app/build/outputs/roborazzi/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          retention-days: 7

      - name: Screenshots → PR comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/publish_screenshots.sh pr ${{ github.event.pull_request.number }}

      - name: Screenshots baseline (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/publish_screenshots.sh main

      - name: Publish "latest" release (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest RMA-Inspector-*-debug.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "Latest build (0.1.${{ github.run_number }})" \
            --notes "Debug build of main at ${GITHUB_SHA::7}. Install on the test tablet: download the APK on the tablet and open it."

  emulator:
    # UI tests on an Android emulator against the mock server (PRs and manual runs only, to save Actions minutes).
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start mock server
        run: |
          pip install -q -r mock-server/requirements.txt
          cd mock-server
          nohup python -m uvicorn mock_server.main:app --host 0.0.0.0 --port 8000 > ../mock-server.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8000/api/v1/health && break; sleep 1; done
        env:
          MOCK_AUTH_OPTIONAL: "1"   # removed when the sign-in screen (A2) lands; tests then sign in as the demo user

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator UI tests (API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-test-report
          path: |
            app/build/reports/androidTests/
            mock-server.log
          retention-days: 7
