name: Android build

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # publish the "latest" release on main

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # A fixed debug signing key lets the tablet install each new APK over the old one.
      # The key lives only in the DEBUG_KEYSTORE_B64 secret (never in the repo).
      - name: Restore debug signing key
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Using fixed debug key."
          else
            echo "::warning::DEBUG_KEYSTORE_B64 not set — APK signed with a throwaway key (uninstall before each update)."
          fi

      - name: Build and unit-test
        run: ./gradlew --no-daemon -PversionCode=${{ github.run_number }} assembleDebug testDebugUnitTest

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "RMA-Inspector-0.1.${{ github.run_number }}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: RMA-Inspector-debug-apk
          path: RMA-Inspector-*-debug.apk
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          retention-days: 7

      - name: Publish "latest" release (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest RMA-Inspector-*-debug.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "Latest build (0.1.${{ github.run_number }})" \
            --notes "Debug build of main at ${GITHUB_SHA::7}. Install on the test tablet: download the APK on the tablet and open it."
