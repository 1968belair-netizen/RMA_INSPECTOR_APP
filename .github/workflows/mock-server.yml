name: Mock server tests

on:
  push:
    branches: [main]
    paths: ["mock-server/**", "testdata/**", ".github/workflows/mock-server.yml"]
  pull_request:
    paths: ["mock-server/**", "testdata/**", ".github/workflows/mock-server.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mock-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
        env:
          REPORT_PNG_DIR: ${{ runner.temp }}/report-previews
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-previews
          path: ${{ runner.temp }}/report-previews
          if-no-files-found: ignore
